<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff">
<title>تجربه‌های REV</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./rev-app-icon.svg"><link rel="stylesheet" href="./rev-visual-identity.css?v=20261020-2">
<style>
:root{color-scheme:light;--ink:#17253b;--muted:#718096;--line:#e5edf5;--blue:#0866ff}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--ink);font-family:Vazirmatn,Vazir,IRANSansX,Tahoma,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:11px max(13px,calc((100vw - 640px)/2));background:#ffffffed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.avatar{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;color:var(--blue);text-decoration:none;font-weight:800}.brand{flex:1}.brand b{display:block;font-size:15px}.brand small{font-size:11px;color:var(--muted)}.primary{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:700}.secondary{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;color:var(--ink)}main{width:min(100%,640px);margin:auto;padding:14px 12px 100px}.intro{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 14px;gap:10px}.intro h1{font-size:20px;margin:0 0 3px}.intro p{font-size:12px;color:var(--muted);margin:0}.status{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;color:var(--muted);font-size:13px;line-height:1.9}.post{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 3px 15px #18334d08}.post-head{display:flex;align-items:center;gap:9px;padding:12px}.person{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:#edf6ff;color:var(--blue);font-weight:800;overflow:hidden}.person img{width:100%;height:100%;object-fit:cover}.author{font-size:12px;font-weight:800}.date{font-size:10px;color:var(--muted);margin-top:3px}.type{margin-right:auto;font-size:10px;background:#f0f6ff;color:#2764a9;border-radius:99px;padding:4px 8px}.post h2{font-size:17px;line-height:1.7;margin:0;padding:0 13px 4px}.story{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.9;margin:0;padding:0 13px 12px;color:#334155}.meta{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 12px}.meta span{background:#f6f9fc;border:1px solid #edf1f6;border-radius:8px;padding:5px 7px;font-size:11px;color:#52647b}.photo{width:100%;max-height:440px;object-fit:cover;display:block}.actions{display:flex;align-items:center;gap:2px;border-top:1px solid #f0f3f7;padding:7px}.action{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:#53647a;padding:7px 8px;border-radius:8px;font-size:12px}.action svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.action.active{color:var(--blue)}.action.like.active{color:#e44765}.spacer{flex:1}.comments{border-top:1px solid #f0f3f7;padding:10px 12px}.comment{font-size:12px;line-height:1.8;margin:7px 0}.comment b{margin-left:5px}.comment-form{display:flex;gap:7px;margin-top:10px}.comment-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:9px}.comment-form button{border:0;background:#edf6ff;color:var(--blue);border-radius:9px;padding:8px 12px}.modal{position:fixed;inset:0;z-index:100000;display:none;align-items:flex-end;justify-content:center;background:#10243b66;padding:12px}.modal.open{display:flex}.sheet{width:min(100%,600px);max-height:90dvh;overflow:auto;background:#fff;border-radius:22px 22px 14px 14px;padding:17px 15px calc(16px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet-head h2{font-size:17px;margin:0}.close{border:0;border-radius:50%;width:34px;height:34px;background:#f1f5f9;font-size:20px}.field{display:block;margin:11px 0}.field span{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea{display:block;width:100%;border:1px solid #dce6f0;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical;line-height:1.8}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.help{font-size:11px;color:var(--muted)}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions button{flex:1}.form-status{font-size:12px;line-height:1.8;color:#52647b;margin-top:8px}.error{color:#b42318}.login-link{color:var(--blue);font-weight:800}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
</style></head>
<body>
<header class="top"><a class="avatar" href="./profile.html?app=1" aria-label="حساب کاربری">ر</a><div class="brand"><b>REV · تجربه‌ها</b><small>سفرها و تجربه‌های رانندگان</small></div><button class="primary" id="openCreate" type="button">＋ انتشار</button></header>
<main><section class="intro"><div><h1>تجربه‌های سفر</h1><p>مسیرها و تجربه‌های واقعی جامعه REV</p></div><button class="secondary" id="refresh" type="button">به‌روزرسانی</button></section><div id="feed" class="status" role="status">در حال دریافت تجربه‌ها…</div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><section class="sheet"><div class="sheet-head"><h2 id="formTitle">انتشار تجربه سفر</h2><button class="close" id="close" type="button" aria-label="بستن">×</button></div>
<form id="createForm"><label class="field"><span>عنوان تجربه *</span><input id="title" maxlength="90" required placeholder="مثلاً سفر با خودروی برقی به شمال"></label>
<div class="two"><label class="field"><span>مبدأ</span><input id="origin" maxlength="100"></label><label class="field"><span>مقصد</span><input id="destination" maxlength="100"></label></div>
<div class="two"><label class="field"><span>مسافت (کیلومتر)</span><input id="distance" type="number" min="0" max="5000" step=".1"></label><label class="field"><span>مدت (دقیقه)</span><input id="duration" type="number" min="0" max="100000"></label></div>
<label class="field"><span>خودرو</span><input id="vehicle" maxlength="80" placeholder="اختیاری"></label>
<label class="field"><span>شرح تجربه</span><textarea id="story" maxlength="3000" placeholder="تجربه، وضعیت شارژ و نکته‌های مسیر را بنویس…"></textarea></label>
<label class="field"><span>عکس‌ها (حداکثر ۵ عکس)</span><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><small class="help">تصاویر پیش از ارسال کوچک می‌شوند.</small></label>
<div id="formStatus" class="form-status" role="status"></div><div class="form-actions"><button class="secondary" id="cancel" type="button">لغو</button><button class="primary" id="publish" type="submit">انتشار تجربه</button></div></form></section></div>
<script src="./register-sw.js" defer></script>
<script>
(function(){
'use strict';
const API='https://rev-auth-api.mojtaba-alimi64.workers.dev', $=id=>document.getElementById(id), feed=$('feed'), modal=$('modal'), form=$('createForm'), formStatus=$('formStatus'), publish=$('publish'), params=new URLSearchParams(location.search);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{try{return new Date(v).toLocaleDateString('fa-IR',{year:'numeric',month:'short',day:'numeric'})}catch{return ''}};
const loginUrl=()=> './index.html?login=1&next='+encodeURIComponent('experiences.html'+location.search+location.hash);
async function api(path,options={}){const r=await fetch(API+path,{credentials:'include',cache:'no-store',...options});const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false){const e=new Error(j.error||('خطای ارتباط ('+r.status+')'));e.status=r.status;throw e}return j}
function imgHtml(src){return typeof src==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(src)?'<img class="photo" loading="lazy" alt="تصویر تجربه سفر" src="'+src+'">':''}
function renderPost(p){const author=p.author_name||'کاربر REV',avatar=p.author_avatar&&/^data:image\/(jpeg|png|webp);base64,/.test(p.author_avatar)?'<img alt="" src="'+p.author_avatar+'">':esc(author.slice(0,1)||'ر'),trip=p.experience_type==='trip_plan',meta=[];
if(p.origin)meta.push('مبدأ: '+esc(p.origin));if(p.destination)meta.push('مقصد: '+esc(p.destination));if(Number(p.distance_km)>0)meta.push(Number(p.distance_km).toLocaleString('fa-IR',{maximumFractionDigits:1})+' کیلومتر');if(Number(p.duration_minutes)>0)meta.push(Number(p.duration_minutes).toLocaleString('fa-IR')+' دقیقه');if(p.vehicle_name)meta.push(esc(p.vehicle_name));
const comments=Array.isArray(p.comments)?p.comments:[],photos=Array.isArray(p.photos)?p.photos.slice(0,5):[];
return '<article class="post" data-id="'+esc(p.id)+'"><div class="post-head"><div class="person">'+avatar+'</div><div><div class="author">'+esc(author)+'</div><div class="date">'+esc(date(p.created_at))+'</div></div><span class="type">'+(trip?'برنامه سفر':'تجربه سفر')+'</span></div><h2>'+esc(p.title)+'</h2>'+(p.story?'<p class="story">'+esc(p.story)+'</p>':'')+(meta.length?'<div class="meta">'+meta.map(x=>'<span>'+x+'</span>').join('')+'</div>':'')+photos.map(imgHtml).join('')+'<div class="actions"><button class="action like" data-act="like" type="button" aria-label="لایک"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg><span class="like-count">'+Number(p.like_count||0).toLocaleString('fa-IR')+'</span></button><button class="action" data-act="comments" type="button" aria-label="دیدگاه‌ها"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>دیدگاه '+comments.length.toLocaleString('fa-IR')+'</span></button><button class="action" data-act="share" type="button" aria-label="اشتراک‌گذاری"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>اشتراک</span></button><span class="spacer"></span><button class="action" data-act="bookmark" type="button" aria-label="ذخیره"><svg viewBox="0 0 24 24"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-4-6 4z"/></svg><span>ذخیره</span></button></div><section class="comments" hidden><div class="comment-list">'+(comments.length?comments.map(c=>'<div class="comment"><b>'+esc(c.author_name||'کاربر REV')+'</b>'+esc(c.body)+'</div>').join(''):'<div class="help">هنوز دیدگاهی ثبت نشده است.</div>')+'</div><form class="comment-form" data-comment-form><input name="body" maxlength="500" placeholder="دیدگاه خود را بنویسید…" required aria-label="متن دیدگاه"><button type="submit">ارسال</button></form><div class="form-status" data-comment-status></div></section></article>'}
async function loadFeed(){feed.className='status';feed.textContent='در حال دریافت تجربه‌ها…';try{const j=await api('/api/experiences?limit=20'),posts=Array.isArray(j.experiences)?j.experiences:[];if(!posts.length){feed.innerHTML='هنوز تجربه‌ای منتشر نشده است.<p><button class="primary" data-open-create type="button">اولین تجربه را منتشر کن</button></p>';return}feed.className='';feed.innerHTML=posts.map(renderPost).join('')}catch(e){feed.className='status';feed.textContent='دریافت تجربه‌ها انجام نشد: '+e.message+'؛ دوباره تلاش کنید.'}}
function openModal(){modal.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('title').focus({preventScroll:true}),30)}function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}function status(msg,err){formStatus.textContent=msg||'';formStatus.classList.toggle('error',!!err)}
function readPhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(Error('خواندن عکس ناموفق بود.'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(Error('یکی از عکس‌ها قابل خواندن نیست.'));im.onload=()=>{const scale=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>340000&&q>.42){q-=.08;d=c.toDataURL('image/jpeg',q)}d.length>350000?reject(Error('حجم یکی از عکس‌ها زیاد است.')):resolve(d)};im.src=r.result};r.readAsDataURL(file)})}
$('openCreate').addEventListener('click',openModal);$('close').addEventListener('click',closeModal);$('cancel').addEventListener('click',closeModal);$('refresh').addEventListener('click',loadFeed);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('createForm').addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;publish.disabled=true;publish.textContent='در حال آماده‌سازی…';status('در حال آماده‌سازی اطلاعات…');try{const files=Array.from($('photos').files||[]).slice(0,5),photos=[];for(const file of files)photos.push(await readPhoto(file));const trip=params.get('type')==='trip_plan',body={title:$('title').value.trim(),story:$('story').value.trim(),experience_type:trip?'trip_plan':'experience',origin:$('origin').value.trim(),destination:$('destination').value.trim(),distance_km:Number($('distance').value)||0,duration_minutes:Number($('duration').value)||0,vehicle_name:$('vehicle').value.trim(),photos};publish.textContent='در حال انتشار…';status('در حال انتشار تجربه…');const j=await api('/api/experiences',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});closeModal();form.reset();await loadFeed();window.scrollTo({top:0,behavior:'smooth'});if(j.message)console.info(j.message)}catch(err){status(err.message+(err.status===401?' برای انتشار باید وارد حساب شوید.':''),true);if(err.status===401){const a=document.createElement('a');a.href=loginUrl();a.className='login-link';a.textContent='ورود به حساب REV';formStatus.append(' ',a)}}finally{publish.disabled=false;publish.textContent='انتشار تجربه'}});
feed.addEventListener('click',async e=>{const first=e.target.closest('[data-open-create]');if(first){openModal();return}const b=e.target.closest('button[data-act]');if(!b)return;const card=b.closest('.post');if(!card)return;const id=card.dataset.id,act=b.dataset.act;if(act==='comments'){const box=card.querySelector('.comments');box.hidden=!box.hidden;if(!box.hidden)box.querySelector('input')?.focus({preventScroll:true});return}if(act==='share'){const url=new URL('./experiences.html?post='+encodeURIComponent(id),location.href).href;try{if(navigator.share)await navigator.share({title:card.querySelector('h2').textContent,text:'تجربه سفر در REV',url});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);b.querySelector('span').textContent='کپی شد'}else prompt('لینک تجربه را کپی کنید:',url)}catch(err){if(err.name!=='AbortError')prompt('لینک تجربه را کپی کنید:',url)}return}if(act==='like'||act==='bookmark'){b.disabled=true;try{const j=await api('/api/experiences/'+encodeURIComponent(id)+'/'+act,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});b.classList.toggle('active',!!j.active);if(act==='like'){const n=b.querySelector('.like-count'),v=Number(n.textContent.replace(/[^0-9]/g,''))||0;n.textContent=Math.max(0,v+(j.active?1:-1)).toLocaleString('fa-IR')}else b.querySelector('span').textContent=j.active?'ذخیره شد':'ذخیره'}catch(err){if(err.status===401&&confirm('برای این کار باید وارد حساب شوید. وارد حساب شوید؟'))location.href=loginUrl();else if(err.status!==401)alert(err.message)}finally{b.disabled=false}}});
feed.addEventListener('submit',async e=>{const f=e.target.closest('form[data-comment-form]');if(!f)return;e.preventDefault();const card=f.closest('.post'),input=f.querySelector('input'),btn=f.querySelector('button'),msg=card.querySelector('[data-comment-status]'),body=input.value.trim();if(!body)return;btn.disabled=true;msg.textContent='در حال ارسال…';try{await api('/api/experiences/'+encodeURIComponent(card.dataset.id)+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});input.value='';await loadFeed();const refreshed=feed.querySelector('.post[data-id="'+CSS.escape(card.dataset.id)+'"]');if(refreshed)refreshed.querySelector('.comments').hidden=false}catch(err){msg.textContent=err.message;if(err.status===401&&confirm('برای ثبت دیدگاه باید وارد حساب شوید. وارد حساب شوید؟'))location.href=loginUrl()}finally{btn.disabled=false}});
$('origin').value=params.get('origin')||'';$('destination').value=params.get('destination')||'';$('distance').value=params.get('distance')||'';const seconds=Number(params.get('duration')||0);$('duration').value=seconds>0?Math.round(seconds/60):'';if(params.get('create')==='1')openModal();loadFeed().then(()=>{const id=params.get('post');if(id){const card=feed.querySelector('.post[data-id="'+CSS.escape(id)+'"]');if(card){card.scrollIntoView({behavior:'smooth',block:'start'});card.querySelector('.comments').hidden=false}}});
})();
</script><script src="./rev-app-mode.js?v=20261020-2"></script></body></html>
