<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="description" content="پروفایل کاربری REV">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./rev-app-icon.svg" type="image/svg+xml">
<title>پروفایل | REV</title>
<link rel="stylesheet" href="./rev-visual-identity.css?v=20261017-3">
<style>
.page-bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.page-bar h1{font-size:18px;margin:0;font-weight:900}
.page-bar .edit{font-size:13px;color:var(--teal);font-weight:800}
.profile-hero{display:flex;align-items:center;gap:14px;padding:20px 16px}
.profile-hero .avatar{width:72px;height:72px;flex:0 0 72px;border-width:3px}
.profile-hero .avatar svg{width:34px;height:34px}
.profile-hero .name{font-size:17px;font-weight:900}
.profile-hero .mail{font-size:12px;color:var(--muted);margin-top:2px;direction:ltr;text-align:right}
.logout-row{color:#d33f3f;font-weight:850}
.logout-row .ico{background:var(--red-soft)!important;color:#d33f3f!important}
.login-hero{text-align:center;padding:30px 20px}
.login-hero .bolt{width:60px;height:60px;border-radius:20px;background:var(--teal-soft);display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
.login-hero h2{font-size:18px;margin:0 0 6px}
.login-hero p{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.9}
[hidden]{display:none!important}
</style>
</head>
<body class="has-bottom-nav">
<div class="app-shell">

<header class="app-header"><div class="wrap page-bar">
  <h1>پروفایل</h1>
  <a class="edit" id="editLink" href="https://mojtabaalimi64-cloud.github.io/rev/account.html">ویرایش</a>
</div></header>

<main class="wrap">
  <!-- حالت واردشده -->
  <div id="loggedIn" hidden>
    <section class="card profile-hero" style="margin-top:18px">
      <span class="avatar" id="bigAvatar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.4 3.1-5.2 7-5.2s6.4 1.8 7 5.2"/></svg>
      </span>
      <span><span class="name" id="userName">…</span><span class="mail" id="userMail" style="display:block"></span></span>
    </section>

    <section class="section" aria-label="منوی حساب">
      <div class="list-card">
        <a class="row-item" href="https://mojtabaalimi64-cloud.github.io/rev/account.html">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.4 3.1-5.2 7-5.2s6.4 1.8 7 5.2"/></svg></span>
          <span class="copy"><b>اطلاعات شخصی</b></span><span class="chev" aria-hidden="true">‹</span>
        </a>
        <a class="row-item" href="https://mojtabaalimi64-cloud.github.io/rev/account.html">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></svg></span>
          <span class="copy"><b>روش‌های پرداخت</b></span><span class="chev" aria-hidden="true">‹</span>
        </a>
        <a class="row-item" href="https://mojtabaalimi64-cloud.github.io/rev/account.html">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg></span>
          <span class="copy"><b>اعلان‌ها</b></span><span class="chev" aria-hidden="true">‹</span>
        </a>
        <a class="row-item" href="https://mojtabaalimi64-cloud.github.io/rev/account.html">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.33c-.8.33-1 .9-1 1.67"/><circle cx="12" cy="16.8" r=".4"/></svg></span>
          <span class="copy"><b>راهنما و پشتیبانی</b></span><span class="chev" aria-hidden="true">‹</span>
        </a>
        <a class="row-item" href="https://mojtabaalimi64-cloud.github.io/rev/">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".5"/></svg></span>
          <span class="copy"><b>درباره REV</b></span><span class="chev" aria-hidden="true">‹</span>
        </a>
      </div>
    </section>

    <section class="section" aria-label="خروج">
      <div class="list-card">
        <button class="row-item logout-row" id="logoutBtn" style="width:100%;background:none;border:0;text-align:right;font-size:14px">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14 4H6v16h8M10 12h11M18 8.5 21.5 12 18 15.5"/></svg></span>
          <span class="copy"><b>خروج از حساب</b></span>
        </button>
      </div>
      <div id="logoutMsg" class="status" role="status"></div>
    </section>
  </div>

  <!-- حالت خارج‌شده -->
  <div id="loggedOut" hidden>
    <section class="card login-hero" style="margin-top:18px">
      <div class="bolt" aria-hidden="true">🔑</div>
      <h2>وارد حساب REV شو</h2>
      <p>برای دیدن پروفایل، آمار سفرها و مدیریت حسابت، اول وارد شو.</p>
      <a class="btn-primary" href="https://mojtabaalimi64-cloud.github.io/rev/account.html">ورود / ثبت‌نام</a>
    </section>
  </div>

  <footer class="app-foot">REV · همراه سفر برقی تو</footer>
</main>

<nav class="bottom-nav" aria-label="پیمایش اصلی"><div class="tabs">
  <a href="./index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg>خانه</a>

  <a href="./trips.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 15l4-4 3 3 4-5M14 9h4v4"/></svg>سفرها</a>
  <a href="https://mojtabaalimi64-cloud.github.io/rev/businesses.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/></svg>خدمات</a>
</div></nav>

</div>
<script>
(function(){
var API='https://rev-auth-api.mojtaba-alimi64.workers.dev';
function validAvatar(v){return typeof v==='string'&&/^data:image\/(?:jpeg|png|webp);base64,/i.test(v);}
async function load(){
  try{
    var r=await fetch(API+'/api/portal/me',{credentials:'include',cache:'no-store'});
    var j=await r.json().catch(function(){return {};});
    if(!r.ok||!j.success||!j.user)throw new Error('not logged in');
    var u=j.user;
    document.getElementById('userName').textContent=u.display_name||'عضو REV';
    var mail=u.email||u.phone_e||'';
    document.getElementById('userMail').textContent=mail;
    if(validAvatar(u.avatar_data)){
      var img=document.createElement('img');img.src=u.avatar_data;img.alt='';
      img.onload=function(){document.getElementById('bigAvatar').replaceChildren(img);};
    }
    document.getElementById('loggedIn').hidden=false;
  }catch(e){
    document.getElementById('loggedOut').hidden=false;
  }
}
document.getElementById('logoutBtn').addEventListener('click',async function(){
  var msg=document.getElementById('logoutMsg');msg.textContent='در حال خروج…';
  try{await fetch(API+'/api/auth/logout',{method:'POST',credentials:'include',body:'{}'});}catch(e){}
  try{localStorage.removeItem('rev_home_avatar_v1');localStorage.removeItem('rev_home_name_v1');}catch(e){}
  document.getElementById('loggedIn').hidden=true;
  document.getElementById('loggedOut').hidden=false;
  msg.textContent='';
});
load();
})();
</script>
<script src="./register-sw.js" defer></script>
</body>
</html>
