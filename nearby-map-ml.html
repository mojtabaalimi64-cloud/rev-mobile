<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>نقشه REV - سه‌بعدی</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:Tahoma}
#map{position:absolute;inset:0}
/* دکمه‌های سمت راست */
#ctrl{position:absolute;top:100px;right:12px;z-index:10;display:flex;flex-direction:column;gap:12px}
#ctrl button{width:52px;height:52px;border:none;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* قطب‌نما */
#compass{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
#compass .n{font-size:11px;font-weight:800;color:#e53935;position:absolute;top:4px}
#compass .arr{font-size:18px;color:#e53935;transform:translateY(4px)}
/* نوار پایین */
#bottombar{position:absolute;bottom:0;right:0;left:0;z-index:10;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:12px 16px 20px}
#bottombar input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:14px;margin-bottom:8px;font-family:Tahoma}
#bottombar .row{display:flex;gap:8px}
#bottombar button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-family:Tahoma}
#btnNav{background:#0d9488;color:#fff}
#btnBack{background:#f0f0f0}
/* منوی پایین */
#tabbar{position:absolute;bottom:0;right:0;left:0;z-index:5;background:#fff;display:flex;border-top:1px solid #eee;padding:8px 0}
#tabbar a{flex:1;text-align:center;text-decoration:none;color:#666;font-size:11px;padding:4px}
#tabbar a.active{color:#0d9488}
</style>
</head>
<body>
<div id="map"></div>
<div id="ctrl">
  <button id="btnLoc" title="مکان من">◎</button>
  <div id="compass" title="شمال"><span class="n">N</span><span class="arr">▲</span></div>
  <button id="btn3d" title="سه‌بعدی">🏔️</button>
</div>
<div id="bottombar">
  <input id="inpDest" placeholder="مقصد: کجا می‌خوای بری؟">
  <div class="row">
    <button id="btnNav">🧭 شروع مسیریابی</button>
    <button id="btnBack" onclick="location.href='./index.html'">خانه</button>
  </div>
</div>
<script>
var map, userMarker, is3d=false, navActive=false;
init();
function init(){
  map = new maplibregl.Map({
    container:'map',
    style:'https://tiles.versatiles.org/assets/styles/colorful/style.json',
    center:[51.4,35.7], zoom:13, pitch:0, maxPitch:70
  });
  
  map.on('load', function(){
    // لایه ساختمون‌های سه‌بعدی
    try{
      map.addLayer({
        'id':'3d-buildings',
        'source':'versatiles-shortbread',
        'source-layer':'buildings',
        'type':'fill-extrusion',
        'minzoom':14,
        'paint':{
          'fill-extrusion-color':'#aaa',
          'fill-extrusion-height':['get','height'],
          'fill-extrusion-base':['get','min_height'],
          'fill-extrusion-opacity':0.6
        }
      });
    }catch(e){ console.log('3d buildings:', e.message); }
  });

  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'bottom-left');
  // مکان کاربر
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(function(p){
      var lng=p.coords.longitude, lat=p.coords.latitude;
      if(!userMarker){
        var el=document.createElement('div');
        el.innerHTML='🚗'; el.style.fontSize='28px';
        userMarker=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
        map.flyTo({center:[lng,lat],zoom:15});
      }else{
        userMarker.setLngLat([lng,lat]);
        if(navActive) map.easeTo({center:[lng,lat],bearing:p.coords.heading||0,pitch:is3d?60:0,duration:500});
      }
    });
  }
  // دکمه‌ها
  document.getElementById('btnLoc').onclick=function(){
    if(userMarker) map.flyTo({center:userMarker.getLngLat(),zoom:16});
  };
  document.getElementById('btn3d').onclick=function(){
    is3d=!is3d;
    this.textContent=is3d?'🗺️':'🏔️';
    map.easeTo({pitch:is3d?60:0,duration:600});
  };
  document.getElementById('compass').onclick=function(){ map.easeTo({bearing:0,pitch:is3d?60:0,duration:500}); };
  map.on('rotate', function(){
    var b=map.getBearing();
    document.querySelector('#compass .arr').style.transform='translateY(4px) rotate('+(-b)+'deg)';
  });
  document.getElementById('btnNav').onclick=function(){
    var d=document.getElementById('inpDest').value;
    if(!d){alert('مقصد رو وارد کن');return;}
    navActive=true; is3d=true;
    document.getElementById('btn3d').textContent='🗺️';
    map.easeTo({pitch:60,duration:800});
    alert('مسیریابی به '+d+' شروع شد (نسخه آزمایشی)');
  };
}
</script>
</body>
</html>
